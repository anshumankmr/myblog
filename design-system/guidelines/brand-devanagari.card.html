<!-- @dsCard group="Brand" viewport="700x330" name="Devanagari wordmark" subtitle="अंशुमन कुमार — three candidates; Plex Sans Devanagari is the default" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@600&family=Tiro+Devanagari+Hindi&display=swap">
<style>
body{margin:0;font-family:var(--font-ui);background:var(--surface-page)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 220px;align-items:center;gap:24px;padding:18px 28px;border-bottom:1px solid var(--border-hairline)}
.row:last-child{border-bottom:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px}
.mark{font-size:24px;line-height:1.2;color:var(--text-heading)}
.nav{display:flex;gap:16px;font-size:14px;color:var(--text-muted)}
.meta{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);line-height:1.5}
.meta b{color:var(--text-heading);font-weight:500}
</style>
</head>
<body>
<div class="row"><div class="bar"><span class="mark" lang="hi" style="font-family:var(--font-devanagari);font-weight:600">अंशुमन कुमार</span><span class="nav"><span>Posts</span><span>Notes</span><span>Now</span></span></div><div class="meta"><b>IBM Plex Sans Devanagari 600</b><br>Default. Same superfamily as everything else.</div></div>
<div class="row"><div class="bar"><span class="mark" lang="hi" style="font-family:'Noto Serif Devanagari',serif;font-weight:600">अंशुमन कुमार</span><span class="nav"><span>Posts</span><span>Notes</span><span>Now</span></span></div><div class="meta"><b>Noto Serif Devanagari 600</b><br>Closer to the Plex Serif headings.</div></div>
<div class="row"><div class="bar"><span class="mark" lang="hi" style="font-family:'Tiro Devanagari Hindi',serif;font-weight:400">अंशुमन कुमार</span><span class="nav"><span>Posts</span><span>Notes</span><span>Now</span></span></div><div class="meta"><b>Tiro Devanagari Hindi 400</b><br>Most bookish. Reads more designed.</div></div>
</body>
</html>
