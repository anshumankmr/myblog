<!-- @dsCard group="Brand" viewport="700x150" name="Wordmark" subtitle="The name in IBM Plex Serif at 600. That is the whole mark." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;font-family:var(--font-ui);background:var(--surface-page)}
.bar{padding:28px 32px;border-bottom:1px solid var(--border-hairline);display:flex;align-items:center;gap:28px}
.mark{font-family:var(--font-display);font-weight:600;font-size:24px;letter-spacing:-0.011em;color:var(--text-heading)}
.short{font-family:var(--font-mono);font-weight:400;font-size:16px;letter-spacing:-0.011em;color:var(--text-heading)}
.note{padding:12px 32px;font-size:12px;color:var(--text-meta)}
.note code{font-family:var(--font-mono);color:var(--text-heading);font-size:11px}
</style>
</head>
<body>
<div class="bar"><span class="mark">Anshuman Kumar</span><span class="short">anshumankumar.net</span></div>
<div class="note">No logo, no lockup, no icon. The header uses the full name in IBM Plex Serif at <code>600 / 17px</code>; the footer uses the domain in Mono. Never set in italic.</div>
</body>
</html>
