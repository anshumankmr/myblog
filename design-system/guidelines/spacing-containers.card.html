<!-- @dsCard group="Spacing" viewport="700x170" name="Layout containers" subtitle="Centered max-width columns per page type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-ui); }
  .wrap { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-3); }
  .track { background: var(--gray-100); border-radius: var(--radius-sm); height: 22px; position: relative; }
  .fill { background: var(--blue-accent); height: 100%; border-radius: var(--radius-sm); display: flex; align-items: center; padding-left: 10px; }
  .fill span { font-size: 11px; font-weight: 600; color: #fff; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--ink-text-light); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="meta">contact · max-w-2xl · 672px</div>
    <div class="track"><div class="fill" style="width:52%"><span>sm</span></div></div>
    <div class="meta">blog post / list · max-w-3xl · 768px</div>
    <div class="track"><div class="fill" style="width:60%"><span>prose</span></div></div>
    <div class="meta">home / about · max-w-4xl · 896px</div>
    <div class="track"><div class="fill" style="width:70%"><span>text</span></div></div>
    <div class="meta">header / footer · max-w-6xl · 1152px</div>
    <div class="track"><div class="fill" style="width:90%"><span>wide</span></div></div>
  </div>
</body>
</html>
