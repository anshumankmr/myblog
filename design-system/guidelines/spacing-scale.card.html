<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base — gutters, rhythm, hero padding" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-ui); }
  .wrap { padding: var(--space-6); display: flex; align-items: flex-end; gap: var(--space-4); }
  .col { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); }
  .bar { background: var(--blue-accent); border-radius: var(--radius-sm); width: 28px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--ink-text-light); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col"><div class="bar" style="height:8px"></div><span class="lbl">2 · 8</span></div>
    <div class="col"><div class="bar" style="height:16px"></div><span class="lbl">4 · 16</span></div>
    <div class="col"><div class="bar" style="height:24px"></div><span class="lbl">6 · 24</span></div>
    <div class="col"><div class="bar" style="height:32px"></div><span class="lbl">8 · 32</span></div>
    <div class="col"><div class="bar" style="height:48px"></div><span class="lbl">12 · 48</span></div>
    <div class="col"><div class="bar" style="height:64px"></div><span class="lbl">16 · 64</span></div>
    <div class="col"><div class="bar" style="height:96px"></div><span class="lbl">24 · 96</span></div>
  </div>
</body>
</html>
