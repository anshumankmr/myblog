<!-- @dsCard group="Type" viewport="700x210" name="IBM Plex Sans + Mono" subtitle="Nav, body, labels in Sans; dates and code in Mono." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;font-family:var(--font-ui);background:var(--surface-page)}
.wrap{padding:24px 32px}
.row{display:flex;align-items:baseline;gap:22px;flex-wrap:wrap}
.nav{font-size:15px;font-weight:500;color:var(--text-heading)}
.navq{font-size:15px;font-weight:400;color:var(--text-muted)}
.label{font-size:12px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--text-muted)}
.date{font-family:var(--font-mono);font-size:13px;color:var(--text-muted)}
.body{margin-top:12px;font-size:16px;line-height:1.5;color:var(--text-body)}
.sub{margin-top:12px;font-size:12px;color:var(--text-meta)}
</style>
</head>
<body>
<div class="wrap">
<div class="row">
<span class="nav">Posts</span><span class="navq">About</span><span class="label">Recent posts</span><span class="date">2023-08-09</span>
</div>
<div class="body">IBM Plex Sans carries the nav, all body prose, and the small caps labels.</div>
<div class="sub">Sans 15/500 active nav, 15/400 muted. Labels 12px 600 caps at 0.07em. Dates always IBM Plex Mono.</div>
</div>
</body>
</html>
