<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
html,body{margin:0;padding:0}
body{width:1280px;height:854px;display:grid;grid-template-columns:1fr 168px;overflow:hidden}
.mark{background:#16191D;display:flex;align-items:center;justify-content:center;padding:0 56px}
.mark span{font-family:'IBM Plex Serif',Georgia,serif;font-weight:600;font-size:132px;line-height:1;letter-spacing:-0.03em;color:#FFFFFF;white-space:nowrap}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}
.strip i{display:block}
</style>
</head>
<body>
<div class="mark"><span>Anshuman</span></div>
<div class="strip"><i style="background:#8CBBFF"></i><i style="background:#63A2FF"></i><i style="background:#1F6FEB"></i><i style="background:#1A5FCC"></i></div>
</body>
</html>
